name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Formiga-macOS-universal
          path: |
            dist/Formiga-*-macOS-universal.dmg
            dist/Formiga-*-macOS-universal.dmg.sha256
            dist/Formiga-*-macOS-universal.zip
            dist/Formiga-*-macOS-universal.zip.sha256

  package-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: dotnet tool install --global wix --version 4.0.5
      - shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Formiga-Windows-x64
          path: |
            dist/Formiga-*-windows-x64.msi
            dist/Formiga-*-windows-x64.msi.sha256
            dist/Formiga-*-windows-x64.zip
            dist/Formiga-*-windows-x64.zip.sha256
