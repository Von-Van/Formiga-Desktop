name: advisories

# Security advisories for the crates Formiga is built from (the RustSec database), once a week and
# whenever the lockfile changes. The updater downloads over HTTPS with ureq and rustls, so an
# advisory against one of those is worth hearing about without waiting for someone to look.

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - .github/workflows/advisories.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit
